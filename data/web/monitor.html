<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FFF Flag Board — Monitor</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body class="monitor">

<div class="bar">
  <div class="bar-title">จอมอนิเตอร์</div>
  <div id="status" class="bar-status"></div>
  <div id="warn" class="bar-warn hidden">ขาดการเชื่อมต่อกับปลั๊กอิน</div>
</div>

<div id="frame" class="frame">
  <div id="canvas" class="canvas" tabindex="0" aria-label="พื้นที่จัดตำแหน่งการ์ด">
    <div class="guide guide-v" data-guide="cx"></div>
    <div class="guide guide-v" data-guide="t1"></div>
    <div class="guide guide-v" data-guide="t2"></div>
    <div class="guide guide-h" data-guide="cy"></div>
    <div class="guide guide-h" data-guide="h1"></div>
    <div class="guide guide-h" data-guide="h2"></div>

    <div id="wrap" class="board-wrap">
      <div class="piece heading-piece" data-target="heading"><div class="board-head">
        <div class="title">ผลการออกธง</div>
        <div id="meta" class="meta"></div>
      </div></div>
      <div id="board" class="board"></div>
    </div>
  </div>
</div>

<div class="controls">
  <label>เลือก <select id="selection"><option value="heading">หัวข้อและเลขรอบ</option></select></label>
  <button id="centerX">กึ่งกลางแนวนอน</button>
  <button id="centerY">กึ่งกลางแนวตั้ง</button>
  <button id="reset">รีเซ็ตชิ้นที่เลือก</button>
  <button id="resetAll">รีเซ็ตทั้งหมด</button>
  <label>ขนาด <input id="scale" type="range" min="50" max="200" step="1" /></label>
  <span id="scaleValue"></span>
  <span id="symmetry" class="symmetry"></span>
</div>
<p id="saveStatus" class="hint" role="status"></p>
<p class="hint">เลือกการ์ดหรือหัวข้อแล้วลาก · ลูกศร 1px · Shift+ลูกศร 10px · ปล่อยแล้วบันทึกเอง · เลือกชิ้นที่ถูกบังได้จากรายชื่อ</p>

<script src="/board.js"></script>
<script>
const CANVAS_W = 1920;
const CANVAS_H = 1080;
const SNAP = 0.015; // fraction of the canvas

const frame = document.getElementById("frame");
const canvas = document.getElementById("canvas");
const wrap = document.getElementById("wrap");
const board = document.getElementById("board");
const meta = document.getElementById("meta");
const statusEl = document.getElementById("status");
const warn = document.getElementById("warn");
const scaleInput = document.getElementById("scale");
const scaleValue = document.getElementById("scaleValue");
const symmetry = document.getElementById("symmetry");
const selection = document.getElementById("selection");
const saveStatus = document.getElementById("saveStatus");

let lastState = null;
let pieces = new Map();
let selected = "heading";
let lastPhase = null;
let dragging = false;
let dragStart = null;
let layoutStart = null;
let draft = null;
let saving = false;
const pending = new Map();

function fitCanvas() {
  const factor = frame.clientWidth / CANVAS_W;
  canvas.style.transform = `scale(${factor})`;
  return factor;
}
window.addEventListener("resize", () => { fitCanvas(); apply(); });

function projectedState() {
  const state = { ...lastState, pieces: { ...lastState.pieces } };
  for (const request of pending.values()) {
    if (request.target === "all") {
      state.layout = { x: 0.5, y: 0.5, scale: 1 };
      state.pieces = {};
    } else if (request.reset) {
      delete state.pieces[request.target];
    } else {
      state.pieces[request.target] = request.layout;
    }
  }
  return state;
}

function apply() {
  if (!lastState) return;
  const overrides = new Map();
  if (draft) overrides.set(draft.target, draft.layout);
  pieces = applyPieceLayouts(wrap, projectedState(), overrides);
  for (const [key, piece] of pieces)
    piece.element.classList.toggle("selected", key === selected);
  const piece = pieces.get(selected);
  for (const id of ["centerX", "centerY", "reset", "scale"])
    document.getElementById(id).disabled = !piece;
  if (!piece) { symmetry.textContent = ""; scaleValue.textContent = ""; return; }
  const layout = piece.layout;
  scaleInput.value = Math.round(layout.scale * 100);
  scaleValue.textContent = Math.round(layout.scale * 100) + "%";
  const width = piece.element.offsetWidth * layout.scale;
  const left = Math.round(layout.x * CANVAS_W - width / 2);
  const right = Math.round(CANVAS_W - (layout.x * CANVAS_W + width / 2));
  const balanced = Math.abs(left - right) <= 2;
  symmetry.textContent = `ซ้าย ${left} · ขวา ${right} ${balanced ? "✓" : ""}`;
  symmetry.classList.toggle("ok", balanced);
}

function showGuides(active) {
  for (const guide of canvas.querySelectorAll(".guide"))
    guide.classList.toggle("on", active.has(guide.dataset.guide));
}

function snap(value, targets, hit) {
  for (const [name, target] of targets) {
    if (Math.abs(value - target) < SNAP) {
      hit.add(name);
      return target;
    }
  }
  return value;
}

// Serialize saves so an older drag cannot arrive after a newer one. Keep local
// edits over incoming vote frames until acknowledged, and retry after outages.
async function flush() {
  if (saving || !pending.size) return;
  saving = true;
  const request = pending.values().next().value;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 5000);
  let retry = false;
  try {
    const res = await fetch("/api/layout", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(request), signal: controller.signal
    });
    if (!res.ok && res.status !== 404) throw new Error("save failed");
    if (pending.get(request.target) === request) {
      if (res.ok) {
        if (request.target === "all") {
          lastState.layout = { x: 0.5, y: 0.5, scale: 1 };
          lastState.pieces = {};
        } else if (request.reset) {
          delete lastState.pieces[request.target];
        } else {
          lastState.pieces[request.target] = request.layout;
        }
      }
      pending.delete(request.target);
    }
    saveStatus.textContent = pending.size ? "กำลังบันทึก…" : "บันทึกแล้ว";
    apply();
  } catch (err) {
    retry = true;
    saveStatus.textContent = "ยังบันทึกไม่ได้ — จะลองส่งใหม่อัตโนมัติ";
  } finally {
    clearTimeout(timeout);
    saving = false;
  }
  if (!retry) flush();
}

function queue(request) {
  pending.set(request.target, request);
  saveStatus.textContent = "กำลังบันทึก…";
  apply();
  flush();
}

function startDraft() {
  const piece = pieces.get(selected);
  if (!piece) return false;
  if (!draft) draft = { target: selected, layout: { ...piece.layout } };
  return true;
}

function commitDraft() {
  if (!draft) return;
  const request = draft;
  request.layout.x = Math.min(1, Math.max(0, request.layout.x));
  request.layout.y = Math.min(1, Math.max(0, request.layout.y));
  request.layout.scale = Math.min(2, Math.max(0.5, request.layout.scale));
  draft = null;
  queue(request);
}

function select(target) {
  commitDraft();
  selected = target;
  selection.value = target;
  apply();
}
selection.onchange = () => select(selection.value);

canvas.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 || dragging) return;
  const piece = event.target.closest(".piece");
  if (!piece) return;
  select(piece.dataset.target);
  canvas.focus({ preventScroll: true });
  if (!startDraft()) return;
  dragging = true;
  dragStart = { x: event.clientX, y: event.clientY };
  layoutStart = { ...draft.layout };
  canvas.setPointerCapture(event.pointerId);
  event.preventDefault();
});

canvas.addEventListener("pointermove", (event) => {
  if (!dragging || !draft) return;
  const layout = draft.layout;
  const factor = frame.clientWidth / CANVAS_W;
  layout.x = layoutStart.x + (event.clientX - dragStart.x) / factor / CANVAS_W;
  layout.y = layoutStart.y + (event.clientY - dragStart.y) / factor / CANVAS_H;

  const hit = new Set();
  layout.x = snap(layout.x, [["cx", 0.5], ["t1", 1 / 3], ["t2", 2 / 3]], hit);
  layout.y = snap(layout.y, [["cy", 0.5], ["h1", 1 / 3], ["h2", 2 / 3]], hit);
  layout.x = Math.min(1, Math.max(0, layout.x));
  layout.y = Math.min(1, Math.max(0, layout.y));
  showGuides(hit);
  apply();
});

function endDrag() {
  if (!dragging) return;
  dragging = false;
  showGuides(new Set());
  commitDraft();
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("lostpointercapture", endDrag);

document.addEventListener("keydown", (event) => {
  if (dragging) return;
  if (event.target.closest("input, select, textarea, button, [contenteditable]")) return;
  if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key) || !startDraft()) return;
  const layout = draft.layout;
  const step = event.shiftKey ? 10 : 1;
  let moved = false;
  if (event.key === "ArrowLeft") { layout.x -= step / CANVAS_W; moved = true; }
  if (event.key === "ArrowRight") { layout.x += step / CANVAS_W; moved = true; }
  if (event.key === "ArrowUp") { layout.y -= step / CANVAS_H; moved = true; }
  if (event.key === "ArrowDown") { layout.y += step / CANVAS_H; moved = true; }
  if (!moved) return;
  event.preventDefault();
  layout.x = Math.min(1, Math.max(0, layout.x));
  layout.y = Math.min(1, Math.max(0, layout.y));
  commitDraft();
});

document.getElementById("centerX").onclick = () => {
  if (startDraft()) { draft.layout.x = 0.5; commitDraft(); }
};
document.getElementById("centerY").onclick = () => {
  if (startDraft()) { draft.layout.y = 0.5; commitDraft(); }
};
document.getElementById("reset").onclick = () => {
  draft = null;
  queue({ target: selected, reset: true });
};
document.getElementById("resetAll").onclick = () => {
  draft = null;
  pending.clear();
  queue({ target: "all", reset: true });
};
scaleInput.oninput = () => {
  if (startDraft()) { draft.layout.scale = scaleInput.value / 100; apply(); }
};
scaleInput.onchange = commitDraft;

function render(state) {
  lastState = state;
  if (!state.pieces) state.pieces = {};
  const revealed = state.phase === "revealed";
  const justRevealed = revealed && lastPhase !== "revealed";
  lastPhase = state.phase;

  // Identical text and geometry to the overlay; live counts live in the bar.
  meta.textContent = `รอบ ${state.round}`;
  statusEl.textContent = revealed
    ? `รอบ ${state.round} · ขึ้นจอแล้ว`
    : `รอบ ${state.round} · ส่งแล้ว ${state.voted}/${state.total} · ยังไม่ขึ้นจอ`;

  // Never blanks: this is what the operator watches while the stream is clean.
  renderBoard(board, state, { revealed: revealed, justRevealed: justRevealed });

  const choices = [["heading", "หัวข้อและเลขรอบ"],
    ...state.presidents.map((p) => ["card:" + p.id, p.name + " — " + p.school])];
  const signature = JSON.stringify(choices);
  if (selection.dataset.choices !== signature) {
    selection.replaceChildren(...choices.map(([key, name]) => new Option(name, key)));
    selection.dataset.choices = signature;
  }
  const keys = new Set(choices.map(([key]) => key));
  for (const key of pending.keys()) {
    if (key !== "all" && !keys.has(key)) pending.delete(key);
  }
  if (!keys.has(selected)) {
    draft = null;
    dragging = false;
    showGuides(new Set());
    selected = "heading";
  }
  selection.value = selected;
  apply();
}

fitCanvas();
setInterval(flush, 3000);
document.fonts.ready.then(apply);

const stream = new EventSource("/api/events/overlay");
stream.onopen = () => warn.classList.add("hidden");
stream.onerror = () => warn.classList.remove("hidden");
stream.onmessage = (event) => {
  warn.classList.add("hidden");
  render(JSON.parse(event.data));
};
</script>
</body>
</html>
