<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FFF Flag Board — Monitor</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body class="monitor">

<div class="bar">
  <div class="bar-title">จอมอนิเตอร์</div>
  <div id="status" class="bar-status"></div>
  <div id="warn" class="bar-warn hidden">ขาดการเชื่อมต่อกับปลั๊กอิน</div>
</div>

<div id="frame" class="frame">
  <div id="canvas" class="canvas">
    <div class="guide guide-v" data-guide="cx"></div>
    <div class="guide guide-v" data-guide="t1"></div>
    <div class="guide guide-v" data-guide="t2"></div>
    <div class="guide guide-h" data-guide="cy"></div>
    <div class="guide guide-h" data-guide="h1"></div>
    <div class="guide guide-h" data-guide="h2"></div>

    <div id="wrap" class="board-wrap draggable">
      <div class="board-head">
        <div class="title">ผลการออกธง</div>
        <div id="meta" class="meta"></div>
      </div>
      <div id="board" class="board"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="centerX">กึ่งกลางแนวนอน</button>
  <button id="centerY">กึ่งกลางแนวตั้ง</button>
  <button id="reset">รีเซ็ต</button>
  <label>ขนาด <input id="scale" type="range" min="50" max="200" step="1" /></label>
  <span id="scaleValue"></span>
  <span id="symmetry" class="symmetry"></span>
</div>
<p class="hint">ลากกระดานเพื่อจัดตำแหน่ง · ลูกศรขยับทีละ 1px · Shift+ลูกศร 10px · ปล่อยแล้วบันทึกเอง</p>

<script src="/board.js"></script>
<script>
const CANVAS_W = 1920;
const CANVAS_H = 1080;
const SNAP = 0.015; // fraction of the canvas

const frame = document.getElementById("frame");
const canvas = document.getElementById("canvas");
const wrap = document.getElementById("wrap");
const board = document.getElementById("board");
const meta = document.getElementById("meta");
const statusEl = document.getElementById("status");
const warn = document.getElementById("warn");
const scaleInput = document.getElementById("scale");
const scaleValue = document.getElementById("scaleValue");
const symmetry = document.getElementById("symmetry");

let layout = { x: 0.5, y: 0.5, scale: 1 };
let lastPhase = null;
let dragging = false;
let dragStart = null;
let layoutStart = null;

function fitCanvas() {
  const factor = frame.clientWidth / CANVAS_W;
  canvas.style.transform = `scale(${factor})`;
  return factor;
}
window.addEventListener("resize", () => { fitCanvas(); updateSymmetry(); });

function boardBox() {
  // Size of the board as it will land on the 1920x1080 canvas.
  return { w: wrap.offsetWidth * layout.scale, h: wrap.offsetHeight * layout.scale };
}

function updateSymmetry() {
  const box = boardBox();
  const left = Math.round(layout.x * CANVAS_W - box.w / 2);
  const right = Math.round(CANVAS_W - (layout.x * CANVAS_W + box.w / 2));
  const balanced = Math.abs(left - right) <= 2;
  symmetry.textContent = `ซ้าย ${left} · ขวา ${right} ${balanced ? "✓" : ""}`;
  symmetry.classList.toggle("ok", balanced);
}

function showGuides(active) {
  for (const guide of canvas.querySelectorAll(".guide"))
    guide.classList.toggle("on", active.has(guide.dataset.guide));
}

function snap(value, targets, key, hit) {
  for (const [name, target] of targets) {
    if (Math.abs(value - target) < SNAP) {
      hit.add(name);
      return target;
    }
  }
  return value;
}

function apply(save) {
  applyLayout(wrap, layout);
  scaleInput.value = Math.round(layout.scale * 100);
  scaleValue.textContent = Math.round(layout.scale * 100) + "%";
  updateSymmetry();
  if (save) {
    fetch("/api/layout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(layout)
    }).catch(() => {});
  }
}

wrap.addEventListener("pointerdown", (event) => {
  dragging = true;
  dragStart = { x: event.clientX, y: event.clientY };
  layoutStart = { x: layout.x, y: layout.y };
  wrap.setPointerCapture(event.pointerId);
  event.preventDefault();
});

wrap.addEventListener("pointermove", (event) => {
  if (!dragging) return;
  const factor = frame.clientWidth / CANVAS_W;
  layout.x = layoutStart.x + (event.clientX - dragStart.x) / factor / CANVAS_W;
  layout.y = layoutStart.y + (event.clientY - dragStart.y) / factor / CANVAS_H;

  const hit = new Set();
  layout.x = snap(layout.x, [["cx", 0.5], ["t1", 1 / 3], ["t2", 2 / 3]], "x", hit);
  layout.y = snap(layout.y, [["cy", 0.5], ["h1", 1 / 3], ["h2", 2 / 3]], "y", hit);
  layout.x = Math.min(1, Math.max(0, layout.x));
  layout.y = Math.min(1, Math.max(0, layout.y));
  showGuides(hit);
  apply(false);
});

function endDrag() {
  if (!dragging) return;
  dragging = false;
  showGuides(new Set());
  apply(true);
}
wrap.addEventListener("pointerup", endDrag);
wrap.addEventListener("pointercancel", endDrag);

document.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? 10 : 1;
  let moved = false;
  if (event.key === "ArrowLeft") { layout.x -= step / CANVAS_W; moved = true; }
  if (event.key === "ArrowRight") { layout.x += step / CANVAS_W; moved = true; }
  if (event.key === "ArrowUp") { layout.y -= step / CANVAS_H; moved = true; }
  if (event.key === "ArrowDown") { layout.y += step / CANVAS_H; moved = true; }
  if (!moved) return;
  event.preventDefault();
  apply(true);
});

document.getElementById("centerX").onclick = () => { layout.x = 0.5; apply(true); };
document.getElementById("centerY").onclick = () => { layout.y = 0.5; apply(true); };
document.getElementById("reset").onclick = () => { layout = { x: 0.5, y: 0.5, scale: 1 }; apply(true); };
scaleInput.oninput = () => { layout.scale = scaleInput.value / 100; apply(false); };
scaleInput.onchange = () => { layout.scale = scaleInput.value / 100; apply(true); };

function render(state) {
  const revealed = state.phase === "revealed";
  const justRevealed = revealed && lastPhase !== "revealed";
  lastPhase = state.phase;

  meta.textContent = revealed ? `รอบ ${state.round}` : `รอบ ${state.round} · ส่งแล้ว ${state.voted}/${state.total}`;
  statusEl.textContent = revealed
    ? `รอบ ${state.round} · ขึ้นจอแล้ว`
    : `รอบ ${state.round} · ส่งแล้ว ${state.voted}/${state.total} · ยังไม่ขึ้นจอ`;

  // Never blanks: this is what the operator watches while the stream is clean.
  renderBoard(board, state, { revealed: revealed, justRevealed: justRevealed });

  if (!dragging && state.layout) {
    layout = state.layout;
    apply(false);
  }
}

fitCanvas();
apply(false);

const stream = new EventSource("/api/events/overlay");
stream.onopen = () => warn.classList.add("hidden");
stream.onerror = () => warn.classList.remove("hidden");
stream.onmessage = (event) => {
  warn.classList.add("hidden");
  render(JSON.parse(event.data));
};
</script>
</body>
</html>
