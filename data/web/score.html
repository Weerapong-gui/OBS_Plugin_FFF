<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>FFF Flag Board · Score</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body class="score">

<!-- A Browser Source that is never blank: the tally is counted as the flags
     arrive, so nothing here reads phase or displayMode. That is the whole
     difference from /overlay, which waits for the operator's press. -->
<div id="board" class="board">
  <div id="round" class="round-pill" hidden><span></span></div>
  <div class="piece heading-piece"><div id="heading" class="heading-text"></div></div>
  <div class="piece count-card count-red"><div class="count-value"></div><div class="count-label">แดง</div></div>
  <div class="piece count-card count-green"><div class="count-value"></div><div class="count-label">เขียว</div></div>
</div>

<script src="/timing.js"></script>
<script src="/board.js"></script>
<script>
const heading = document.getElementById("heading");
const roundPill = document.getElementById("round");
const roundText = roundPill.firstElementChild;
const counts = { red: document.querySelector(".count-red .count-value"),
  green: document.querySelector(".count-green .count-value") };

function render(state) {
  // The lengths of the count roll come from the session, the same as on air.
  applyTiming(state.timing);
  applyHeadingTemplate(heading, scoreHeadingOf(state.scoreHeadingTemplate));
  // A state without a round is not a round zero; the pill goes away instead.
  const hasRound = Number.isFinite(state.round);
  roundPill.hidden = !hasRound;
  if (hasRound)
    roundText.textContent = "รอบ " + state.round;
  const count = scoreCountOf(state.scoreCountTemplate);
  const presidents = state.presidents || [];
  for (const vote of ["red", "green"]) {
    applyCountTemplate(counts[vote], count, vote);
    rollCount(counts[vote], presidents.filter(president => president.vote === vote).length,
      presidents.length);
  }
}

const stream = new EventSource("/api/events/overlay");
stream.onmessage = (event) => { render(JSON.parse(event.data)); };
</script>
</body>
</html>
